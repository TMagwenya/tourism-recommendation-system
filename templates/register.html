<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Create Account | Explore Malawi</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">


</head>

<body class="register-page">


<div class="register-container">

    <div class="register-card">

        <h1>Create Your Account</h1>

        <p class="register-description">
            Join Explore Malawi to discover destinations that match your interests.
        </p>

        <!-- Display messages from Flask -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="register-message {{ category }}">
                    {{ message }}
                </p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">

            <div class="register-field">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    minlength="3"
                    maxlength="50"
                    autocomplete="username"
                    placeholder="Enter your username"
                >
            </div>

            <div class="register-field">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    maxlength="254"
                    autocomplete="email"
                    placeholder="Enter your email"
                >
            </div>

            <div class="register-field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Enter your password"
                >
            </div>

            <div class="register-field">
                <label for="confirm_password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Confirm your password"
                >
            </div>

            <button type="submit" class="register-button">
                Create Account
            </button>

        </form>

        <p class="register-login">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in here</a>.
        </p>

        <p class="register-home">
            <a href="{{ url_for('home') }}">Back to Home</a>
        </p>

    </div>

</div>


</body>
</html>
