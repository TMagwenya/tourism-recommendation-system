<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Preferences | Explore Malawi</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <a href="{{ url_for('dashboard') }}" class="logo">
            Explore Malawi
        </a>

        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('home') }}">Home</a>
        </nav>

    </header>

    <!-- Travel Preferences Form -->
    <main class="preferences-page">

        <section class="preferences-container">

            <p class="eyebrow">PLAN YOUR NEXT ADVENTURE</p>

            <h1>Tell Us About Your Travel Preferences</h1>

            <p class="form-description">
                Help us discover tourism destinations in Malawi
                that match your interests, budget, and travel plans.
            </p>

            <form method="POST" action="{{ url_for('preferences') }}">

                <!-- Preferred Location -->
                <div class="form-group">
                    <label for="preferred_location">
                        Preferred Location
                    </label>

                    <select id="preferred_location"
                            name="preferred_location"
                            required>

                        <option value="">Choose a location</option>
                        <option value="Northern Malawi"
    {% if preferences and preferences['preferred_location'] == 'Northern Malawi' %}selected{% endif %}>
    Northern Malawi
</option>
                        <option value="Central Malawi"
    {% if preferences and preferences['preferred_location'] == 'Central Malawi' %}selected{% endif %}>
    Central Malawi
</option>
                        <option value="Southern Malawi"
    {% if preferences and preferences['preferred_location'] == 'Southern Malawi' %}selected{% endif %}>
    Southern Malawi
</option>
                        <option value="Anywhere in Malawi"
    {% if preferences and preferences['preferred_location'] == 'Anywhere in Malawi' %}selected{% endif %}>
    Anywhere in Malawi
</option>
                    </select>
                </div>

                <!-- Budget -->
                <div class="form-group">
                    <label for="budget">
                        Travel Budget (MWK)
                    </label>

                   <input type="number"
       id="budget"
       name="budget"
       placeholder="Enter your budget"
       min="0"
       value="{{ preferences['budget'] if preferences else '' }}"
       required>
                </div>

                <!-- Preferred Activity -->
                <div class="form-group">
                    <label for="preferred_activity">
                        Preferred Activity
                    </label>

                    <select id="preferred_activity"
                            name="preferred_activity"
                            required>
                        <option value="">Choose an activity</option>

<option value="Wildlife"
    {% if preferences and preferences['preferred_activity'] == 'Wildlife' %}selected{% endif %}>
    Wildlife viewing
</option>

<option value="Hiking"
    {% if preferences and preferences['preferred_activity'] == 'Hiking' %}selected{% endif %}>
    Hiking and mountain climbing
</option>

<option value="Water activities"
    {% if preferences and preferences['preferred_activity'] == 'Water activities' %}selected{% endif %}>
    Water activities
</option>

<option value="Culture"
    {% if preferences and preferences['preferred_activity'] == 'Culture' %}selected{% endif %}>
    Cultural experiences
</option>

<option value="Camping"
    {% if preferences and preferences['preferred_activity'] == 'Camping' %}selected{% endif %}>
    Camping
</option>

<option value="Relaxation"
    {% if preferences and preferences['preferred_activity'] == 'Relaxation' %}selected{% endif %}>
    Relaxation
</option>

<option value="Sightseeing"
    {% if preferences and preferences['preferred_activity'] == 'Sightseeing' %}selected{% endif %}>
    Sightseeing
</option>

                    </select>
                    <label for="duration_days">Preferred Travel Duration (Days):</label>
                       <input
    type="number"
    id="duration_days"
    name="duration_days"
    min="1"
    value="{{ preferences['duration_days'] if preferences else '' }}"
    placeholder="Enter number of days"
    required
>
                </div>

                
                <!-- Interest Category -->
                <div class="form-group">
                    <label for="interest_category">
                        Main Interest
                    </label>

                    <select id="interest_category"
                            name="interest_category"
                            required>

                       <option value="">Choose your main interest</option>

<option value="Nature"
    {% if preferences and preferences['interest_category'] == 'Nature' %}selected{% endif %}>
    Nature
</option>

<option value="Adventure"
    {% if preferences and preferences['interest_category'] == 'Adventure' %}selected{% endif %}>
    Adventure
</option>

<option value="Wildlife"
    {% if preferences and preferences['interest_category'] == 'Wildlife' %}selected{% endif %}>
    Wildlife
</option>

<option value="Culture"
    {% if preferences and preferences['interest_category'] == 'Culture' %}selected{% endif %}>
    Culture and heritage
</option>

<option value="Beaches"
    {% if preferences and preferences['interest_category'] == 'Beaches' %}selected{% endif %}>
    Beaches and lake tourism
</option>

<option value="Relaxation"
    {% if preferences and preferences['interest_category'] == 'Relaxation' %}selected{% endif %}>
    Relaxation
</option>

                    </select>
                </div>

                <div class="form-group">
    
                  </div>

                <button type="submit" class="primary-button">
                    Save My Preferences
                </button>

            </form>

        </section>

    </main>

    <footer class="footer">
        <p>
            &copy; 2026 Tourism Personalized Recommendation System | Malawi
        </p>
    </footer>

</body>
</html>
