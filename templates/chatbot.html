
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malawi Tourism Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .chat-page {
            max-width: 850px;
            margin: 35px auto;
            padding: 20px;
        }

        .chat-header {
            background: linear-gradient(135deg, #075b43, #15966d);
            color: white;
            text-align: center;
            padding: 30px 20px;
            border-radius: 15px;
        }

        .chat-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            min-height: 350px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        #chatMessages {
            height: 350px;
            overflow-y: auto;
            padding: 10px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            margin: 10px 0;
            max-width: 85%;
            white-space: pre-wrap;
        }

        .user-message {
            background: #d9f5e8;
            margin-left: auto;
        }

        .bot-message {
            background: #f0f2f2;
            margin-right: auto;
        }

        .chat-form {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .chat-form input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .chat-form button {
            background: #087b55;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
        }

        .chat-back {
            display: inline-block;
            margin-top: 20px;
            color: #087b55;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="chat-page">

    <header class="chat-header">
        <h1>Malawi Tourism Assistant</h1>
        <p>Ask me anything about travelling and exploring Malawi.</p>
    </header>

    <section class="chat-box">
        <div id="chatMessages" aria-live="polite">
            <div class="message bot-message">
                Hello! I'm your Malawi Tourism Assistant.
                Ask me about destinations, activities and travel information.
            </div>
        </div>

        <form class="chat-form" id="chatForm">
            <input
                type="text"
                id="userMessage"
                placeholder="Ask me about Malawi tourism..."
                required
            >
            <button type="submit" id="sendButton">Send</button>
        </form>
    </section>

    <a class="chat-back" href="{{ url_for('dashboard') }}">
        ← Back to Dashboard
    </a>

</div>

<script>
    const chatForm = document.getElementById("chatForm");
    const chatMessages = document.getElementById("chatMessages");
    const userInput = document.getElementById("userMessage");
    const sendButton = document.getElementById("sendButton");

    const conversation = [];

    chatForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const message = userInput.value.trim();
        if (!message) return;

        addMessage(message, "user-message");
        conversation.push({ role: "user", text: message });

        userInput.value = "";
        sendButton.disabled = true;
        sendButton.textContent = "Thinking...";

        try {
            const response = await fetch("/chatbot/message", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message, history: conversation.slice(-10) })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.reply || "Unable to get a response.");
            }

            addMessage(data.reply, "bot-message");
            conversation.push({ role: "model", text: data.reply });

        } catch (error) {
            addMessage(error.message, "bot-message");
        }

        sendButton.disabled = false;
        sendButton.textContent = "Send";
        userInput.focus();
    });

    function addMessage(text, className) {
        const messageDiv = document.createElement("div");
        messageDiv.className = "message " + className;
        messageDiv.textContent = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>

</body>
</html>
